<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>udah selesai aja nih</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#dfe7ff; --ink:#1b2152; --soft:#5a63a0; --no:#c9d2f5; --yes:#ff6f91; --yes-ink:#fff; --paper:#fff; --paper-ink:#1b2152; --dana:#118eea;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--bg:#141a3d;--ink:#eef1ff;--soft:#9aa4e0;--no:#262e66;--yes:#ff7f9e;--yes-ink:#1b0a12;--paper:#141a3d;--paper-ink:#eef1ff}
}
:root[data-theme="dark"]{--bg:#141a3d;--ink:#eef1ff;--soft:#9aa4e0;--no:#262e66;--yes:#ff7f9e;--yes-ink:#1b0a12;--paper:#141a3d;--paper-ink:#eef1ff}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);overflow:hidden;
  font-family:"Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
.stage{height:100%;position:relative;overflow:hidden}
.screen{position:absolute;inset:0;display:flex;flex-direction:column;padding:28px 24px 32px;
  transition:transform .7s cubic-bezier(.7,0,.2,1),opacity .5s}
#s1{justify-content:center;align-items:flex-start;touch-action:none;cursor:grab}
#s2{transform:translateY(100%);opacity:0}
.stage.next #s1{transform:translateY(-100%);opacity:0}
.stage.next #s2{transform:none;opacity:1}
h1,h2{margin:0;font-weight:800;line-height:1.02;letter-spacing:-.03em}
h1{font-size:clamp(3rem,14vw,5.5rem)}
h2{font-size:clamp(2.4rem,11vw,4.2rem)}
.hint{margin-top:2rem;color:var(--soft);font-weight:500;font-size:1.05rem;display:flex;align-items:center;gap:.6rem;
  background:none;border:0;padding:0;font-family:inherit;cursor:pointer}
.hint .arrow{display:inline-block;animation:bob 1.6s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-6px)}}
#s2 h2{margin-top:auto}
.btns{flex:1;min-height:0;display:flex;flex-direction:column;justify-content:flex-end;gap:14px;margin-top:1.5rem}
button.b{font-family:inherit;font-weight:800;border:0;border-radius:999px;cursor:pointer;text-align:center;
  line-height:1.05;max-width:100%;transition:all .45s cubic-bezier(.3,1.5,.5,1);-webkit-tap-highlight-color:transparent}
button.b:active{transform:scale(.96)}
button.b:focus-visible,.hint:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
#no{background:var(--no);color:var(--ink);font-size:max(.8rem,calc(1.05rem - var(--n,0) * .05rem));
  padding:.9rem 1.6rem;align-self:flex-start}
#yes{background:var(--yes);color:var(--yes-ink);align-self:flex-start;
  font-size:calc(1.15rem * var(--s,1));padding:calc(.9rem * var(--s,1)) calc(1.7rem * var(--s,1));
  border-radius:calc(999px)}
.btns.full #yes{flex:1;align-self:stretch;display:flex;align-items:center;justify-content:center;font-size:clamp(3rem,16vw,5rem)}
.done{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;overflow-y:auto;
  background:var(--yes);color:var(--yes-ink);text-align:center;padding:28px 24px 32px;opacity:0;pointer-events:none;transition:opacity .5s}
.done.show{opacity:1;pointer-events:auto}
.done h2{margin:0}
#no.gone{font-size:.2rem;padding:.08rem .25rem;opacity:.4;pointer-events:none}
.done .top{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1.5rem;width:100%}
.letter{display:grid;grid-template-rows:0fr;width:100%;max-width:26rem;transition:grid-template-rows 1.1s cubic-bezier(.3,.8,.3,1)}
.letter.open{grid-template-rows:1fr}
.paper{min-height:0;overflow:hidden;background:var(--paper);color:var(--paper-ink);border-radius:6px 6px 14px 14px;text-align:left}
.letter.open .paper{box-shadow:0 10px 30px rgba(0,0,0,.18)}
.paper p{margin:0;padding:1.4rem 1.3rem;font-size:1.1rem;line-height:1.55;font-weight:500}
.gift{font-family:inherit;font-weight:800;font-size:.95rem;border:0;cursor:pointer;background:var(--dana);color:#fff;padding:.7rem 1.2rem;border-radius:10px;transition:opacity .4s,transform .2s}
.gift:active{transform:scale(.96)}
.gift:focus-visible{outline:3px solid var(--yes-ink);outline-offset:3px}
.gift.opened{opacity:0;pointer-events:none}
@media (prefers-reduced-motion:reduce){
  .screen,button.b,.done,.letter,.gift{transition:none}
  .hint .arrow{animation:none}
}
</style>
</head>
<body>
<div class="stage" id="stage">
  <section class="screen" id="s1" aria-label="Halaman awal">
    <h1>udah selesai aja nih utsnya</h1>
    <button class="hint" id="go" type="button"><span class="arrow" aria-hidden="true">↑</span> geser ke atas</button>
  </section>

  <section class="screen" id="s2" aria-label="Pertanyaan">
    <h2>habis uts free nggaa?</h2>
    <div class="btns" id="btns">
      <button class="b" id="no" type="button">nggak</button>
      <button class="b" id="yes" type="button">free nih</button>
    </div>
  </section>

  <div class="done" id="done" role="status" aria-live="polite">
    <div class="top">
      <h2>oh, gapapa sih tanya doang</h2>
      <div class="letter" id="letter"><div class="paper"><p>Halo Rahma, selamat ya udah hampir nyelesain uts ini, capek ya?, mau kopi? Eskrim?, atau apa boleh sini pc aja, udah sih pengen ganggu aja hehe, tapi kalau beneran free infoin dong 🙂</p></div></div>
    </div>
    <button class="gift" id="gift" type="button">dana kaget</button>
  </div>
</div>

<script>
(function(){
  var stage=document.getElementById('stage'), s1=document.getElementById('s1');
  var btns=document.getElementById('btns'), no=document.getElementById('no'), yes=document.getElementById('yes');
  var done=document.getElementById('done');
  var opened=false;

  function open(){ if(opened) return; opened=true; stage.classList.add('next'); }

  // swipe / drag ke atas
  var startY=null;
  s1.addEventListener('pointerdown',function(e){ startY=e.clientY; });
  s1.addEventListener('pointermove',function(e){ if(startY!==null && startY-e.clientY>50){ startY=null; open(); } });
  s1.addEventListener('pointerup',function(){ startY=null; });
  s1.addEventListener('pointercancel',function(){ startY=null; });
  // cadangan untuk laptop: scroll, tombol, keyboard
  window.addEventListener('wheel',function(e){ if(e.deltaY>10) open(); },{passive:true});
  window.addEventListener('keydown',function(e){ if(e.key==='ArrowDown'||e.key==='ArrowUp'||e.key===' '||e.key==='Enter'){ if(!opened && document.activeElement.id!=='go'){ e.preventDefault(); } open(); } });
  document.getElementById('go').addEventListener('click',open);

  // tombol "nggak" -> tombol "free nih" makin gede
  var labels=['nggak','yakin nggak?','beneran nggak?','hmm… serius?','coba pikir lagi deh','yaudah nggak'];
  var n=0, MAX=5;
  no.addEventListener('click',function(){
    n++;
    no.textContent=labels[Math.min(n,labels.length-1)];
    var lvl=Math.min(n,MAX);
    btns.style.setProperty('--n',lvl);
    yes.style.setProperty('--s',(1+lvl*0.45).toFixed(2));
    document.getElementById('no').style.setProperty('--n',lvl);
    if(n>=MAX-1) btns.classList.add('full');
    if(n>=MAX){ no.classList.add('gone'); no.disabled=true; }
  });

  yes.addEventListener('click',function(){ done.classList.add('show'); });

  var gift=document.getElementById('gift'), letter=document.getElementById('letter');
  gift.addEventListener('click',function(){ letter.classList.add('open'); gift.classList.add('opened'); gift.disabled=true; });
})();
</script>
</body>
</html>
